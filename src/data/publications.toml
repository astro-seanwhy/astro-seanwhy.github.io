# The one place to edit the publication list. After a change, run: python3 src/build.py
#
# Fields:
#   section   research | geophysics | patent | software | proposal
#   authors   Written "H. S. Wang, A. Johansen, ..."; your name is bolded and the
#             first-author filter is worked out from this field automatically.
#   year, title, venue
#   doi, arxiv, url   Optional links. Add whichever exists; leave out the others.
#   themes    Optional. Lists the paper under a research theme, on that theme's page and in
#             the Themes view of the Publications page. Keys are set in src/data/themes.toml:
#             star-planet | interiors | habitability. A paper may have more than one.
#   summary   One plain sentence. Shown on the theme pages, on the Latest results page and
#             with a featured paper on the home page.
#   featured  Optional. true lists the paper under "Selected publications" on the home page.
#   figure    Optional. Image in assets/pubs/, shown on the Latest results page.
#   figure_alt, figure_note   Description for screen readers, and the credit line under the figure.
#   year_label  Optional. Shown instead of the year.

